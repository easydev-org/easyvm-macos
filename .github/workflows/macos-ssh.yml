name: macos

# macos, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE LEGS USED TO RUN AS ONE PARALLEL MATRIX, and that produced a race with a timeout for a tail: a leg
# asks for the tag the leg before it publishes, gets a 404 because that leg is still running, falls back
# to the INSTALL disk - which has no sshd - and spends its whole budget on a machine that could never
# answer.
#
# `needs:` IS THE FIX, AND IT IS WHAT THE REFERENCE IMPLEMENTATION ALWAYS DID:
#
#	jobs/bake  ->  jobs/launch needs bake  ->  jobs/ssh needs bake  ->  jobs/vm-configure needs ssh
#
# A leg cannot start before the artifact it pulls exists, because it is not SCHEDULED until then. The
# cost is the sum rather than the maximum, and that is the right way round: a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#

on:
  # ONE STAGE, DISPATCHED BY HAND. This was a job inside `macos.yml`, where `needs:` decided the
  # order; each stage is its own workflow now.
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-macos"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default macos15)
        default: "macos15"

concurrency:
  group: macos-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      # 100 GB, BECAUSE THIS LEG HOLDS THREE COPIES OF A 28.6 GiB SYSTEM AT ONCE.
      #
      # `disk_gb` is the FREE SPACE this job checks for before it starts, and it has now been wrong
      # twice in the same direction:
      #
      #	25   smaller than the one artifact it pulls. MEASURED on 45597026226:
      #	     `attempt 1/8: 0 of 30010703872` then `recording NOT written: ffmpeg: End of file`
      #
      #	70   covered the pull but not the PEAK. MEASURED on 45600395447, which ran all 34 steps
      #	     and then died in `publish the disk`:
      #
      #	     qemu-img convert: error while writing at byte 43931992064: No space left on device
      #
      # WHAT THE PEAK IS, from that run's own `ls -l` of the work directory:
      #
      #	disk.qcow2          28620 MiB   the pulled system, read-only backing
      #	run-overlay.qcow2   25243 MiB   what the guest wrote: macOS at first boot
      #	publish target      ~30000 MiB  the compressed flatten of the two
      #	                   ----------
      #	                   ~84 GiB     and the runner had 84
      #
      # THE OVERLAY IS NOT OPTIONAL AND IT IS NOT SMALL. Every boot after the install reads through a
      # read-only base (see overlay.Create) - that is what makes `discard=unmap` safe and what lets a
      # failed run leave the published disk untouched - and a macOS first boot writes cache, the sleep
      # image and a journal, tens of GiB of it, into that diff.
      #
      # 100 IS THE SUM ROUNDED UP. It also crosses `runner-check`'s prune threshold, which only fires
      # when the requirement EXCEEDS what the runner currently has: at 70 against 84 GiB free the
      # check passed and pruned nothing, so the .NET SDK, the Android SDK, GHC and CodeQL - 20 to 30
      # GiB of them - sat there through the whole leg and could have been the difference.
      disk_gb: "100"
      group: macos-ssh
      disks_repository: ${{ inputs.disks_repository }}
      # THE FIRMWARE IS AN ASSET THIS WALK BOOTS FROM, AND `assets:` WAS EMPTY.
      #
      # MEASURED on run 45598310905, whose first step refused to start:
      #
      #	error: the media this stage boots from is already on disk: boot.img is not in
      #	       .../work; macos.rom is not in .../work; macos.vars is not in .../work
      #
      # `15/steps/ssh.walk` declares `needs [boot.img, macos.rom, macos.vars]`, and its boot line
      # loads them as `if=pflash ... file=macos.rom`, `file=macos.vars` and `file=boot.img,format=raw`.
      # All three come from `macos-firmware-15`, the tag `artifacts-publish.yml`'s `opencore` job
      # writes for release 15 - it builds boot.img and macos.rom from the mirrored recovery image and
      # renders macos.vars from its template.
      #
      # `pull:` AND `assets:` ARE DIFFERENT THINGS AND THIS STAGE NEEDED BOTH. `pull: macos15` is the
      # published SYSTEM, 28.6 GiB of installed macOS. `assets:` is everything else the machine needs
      # to BE a machine. With an empty list the disk arrived and the firmware did not, so the guest
      # had nothing to boot from. The install leg declares this same tar for the same reason; ssh
      # needs only it, because the recovery image is what an INSTALLER reads and not what a finished
      # disk does.
      #
      # NOTE FOR THE NEXT EDIT: `stages:` IS A JSON ARRAY IN A YAML BLOCK SCALAR. JSON has no
      # comments, so an explanation put between its braces makes the whole stage unparseable and the
      # workflow is rejected before any job exists - which is what happened to run 45600145134.
      stages: |
        [
          {
            "name": "macos-ssh",
            "file": "15/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "assets": ["macos-firmware-15:macos-firmware.tar"],
            "out": "macos15-ssh.qcow2",
            "publish": "macos15-ssh",
            "timeout": 120
          }
        ]
