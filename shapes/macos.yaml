# macOS: OPENCORE, NOT UEFI, AND EVERY LINE BELOW IS A MEASUREMENT.
#
# This is the one shape with a fan-out: firmware, boot order, CPU flags, SMP grammar, video adapter,
# sound card and SMC key all turn on it, and each is a SILENT failure when wrong - the guest boots and
# simply never draws, or draws at 640x480, or deadlocks at HANDOFF TO XNU.

name: macos
description: "OpenCore, Apple's CPU flags, no VGA adapter, USB audio and the SMC key"

firmware:
  # OPENCORE IS A DIRECTORY THIS BUILD KNOWS NOTHING ABOUT. `fetch folder` unpacks it into the work
  # directory and the profile below says what to do with the files in it.
  #
  # THIS USED TO BE `kind: opencore`, WHICH WAS A GO BRANCH: three fields on the boot spec, two
  # special cases in `StorageArgs` and one in `FirmwareArgs`, all of it macOS knowledge in a package
  # that is meant to know only what a shape tells it.
  kind: folder
  dir: "{{work}}"

# THE CPU FLAG LIST, AND EACH ENTRY IS LOAD-BEARING.
#
#	+invtsc    ONE OF THE TWENTY FLAGS macOS NEEDS, AND TCG CANNOT PROVIDE IT. That is the deadlock
#	           documented in internal/machine: every vCPU at 100%, block I/O frozen, the serial output
#	           ending at `[EB|LOG:HANDOFF TO XNU]` with no panic.
#	vmx=off    macOS refuses to boot when the host advertises VMX it cannot use.
#	vendor=GenuineIntel  the kernel checks; a QEMU vendor string stops it before it draws.
#	check      qemu refuses at startup rather than silently ignoring a flag this CPU cannot provide,
#	           which turns a forty-minute boot into an immediate error.
cpu:
  suffix: ",vendor=GenuineIntel,vmx=off,vmware-cpuid-freq=on,-pdpe1gb,+invtsc,+ssse3,+sse4.2,+popcnt,+avx,+avx2,+aes,+fma,+bmi1,+bmi2,+smep,+xsave,+xsaveopt,+xgetbv1,+movbe,+rdrand,check"

# A BARE COUNT IS NOT WHAT macOS UNDERSTANDS. dockur's configureSmp() spells out sockets, dies, cores
# and threads, and the guest reads that structure.
smp:
  format: topology

# `none`, BECAUSE ON q35 `-vga` CREATES AN ISA VGA DEVICE ON THE LEGACY BUS and macOS expects the PCIe
# one - which OpenCore supplies as `vmware-svga` in the profile's own arguments below.
video:
  kind: none

# `usb-audio`, NOT HDA, AND IT IS THE ONLY DEVICE APPLE'S DRIVER BINDS WITHOUT INJECTION.
#
# MEASURED: AppleHDA's controller loads against an ICH9 HDA device once OpenCore injects a matching
# device-id - `com.apple.driver.AppleHDAController`, `com.apple.iokit.IOHDAFamily` and
# `com.apple.iokit.IOAudioFamily` all appear - but it NEVER ENUMERATES THE CODEC: `IOHDACodecDevice`
# has no children, `AppleHDAEngine` is never instantiated, and CoreAudio reports zero devices.
# `AppleUSBAudio` is in every macOS, is already loaded, and binds qemu's `usb-audio` with no injection.
audio: usb

# THE KEY IS NOT A SECRET AND IS NOT OPTIONAL. macOS reads it from the SMC to decide whether the
# firmware is Apple's, and without it the kernel stops before it draws anything.
smc: true

# APPLE'S OWN AGENT NEVER LOADS UNDER QEMU, and the third-party one that does probes
# `/dev/cu.serial1` first - which is the FIRST isa-serial device qemu adds, so this must be the only
# one.
qga: isa-serial

# macOS'S INSTALLER IS THE RECOVERY IMAGE ON A USB DEVICE, so a boot that attaches it is the one that
# writes. Every later stage boots an installed system and attaches nothing.
install_medium: recovery

media:
  # macOS HAS NO INSTALL ISO, and the refusal says so rather than letting a stage attach one and watch
  # the guest sit in the UEFI shell.
  iso: false
  iso_reason: "macOS has no install ISO; it installs from its recovery image. Use `recovery:` rather than `iso:`"
  recovery: true

# TWO PROFILES, BECAUSE AN INSTALL AND AN INSTALLED SYSTEM ARE DIFFERENT MACHINES.
#
# THE DIFFERENCE IS NOT A PLACEHOLDER. An install attaches the recovery image as a USB disk and MUST
# NOT let a trim reach the target: MEASURED, 42009463444 wrote 36774 MiB, dropped to 19761 and froze
# at "About 48 minutes remaining", because qemu honoured every TRIM for clusters the APFS snapshot
# still referred to. An installed disk is the opposite - no recovery device, and discard=unmap is
# exactly what keeps the published qcow2 small (26 GiB of freed blocks that `qemu-img convert -c`
# cannot remove).
#
# A WALK SELECTS ONE BY THE `recovery:` IT GIVES ITS `boot:` STEP, which is the same fact stated once:
# the profile that attaches a recovery image is the profile that installs.
qemu:
  default: disk

  profiles:
    # ------------------------------------------------------------- install
    install:
      # OpenCore's own disk at bootindex=0, the target at 1. "A disk with no bootindex is not in the
      # boot order at all" - the firmware then reports it could not load Boot0001, six runs in a row.
      #
      # NO `discard=unmap` ON THE TARGET, for the measurement above.
      machine: "q35,accel=kvm,vmport=off"

      args:
        # THE TWO PFLASH SLOTS. `readonly=on` for the ROM because qemu must not write to it; the
        # variables store is per-guest NVRAM and qemu DOES write it, which is why the fetch makes a
        # copy per guest rather than referencing the template.
        - ["-drive", "if=pflash,format=raw,readonly=on,file={{dir}}/macos.rom"]
        - ["-drive", "if=pflash,format=raw,file={{dir}}/macos.vars"]

        # OPENCORE'S OWN DISK, FIRST AND WITH `bootindex=0`.
        - ["-drive", "file={{dir}}/boot.img,format=raw,if=none,id=oc"]
        - ["-device", "virtio-blk-pci,drive=oc,bootindex=0"]

        # THE AGENT'S PORT. Apple's third-party agent probes `/dev/cu.serial1`, so this must be the
        # only isa-serial device the machine creates.
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "isa-serial,chardev=qga0"]

        # THE CONTROLLER AND THE POINTER, ON EVERY BOOT. A MAC HAS NO PS/2, so a pointer that is not
        # on USB is a pointer that does not exist - a macOS guest booted from an installed disk had
        # NO POINTER AT ALL until this was written, and its first click died in qemu:
        #
        #	click (965, 981): pointer to (965, 981): Input handler not found for event type abs
        #
        # THE CONTROLLER COMES FIRST because qemu resolves `bus=xhci.0` as it parses.
        - ["-device", "qemu-xhci,id=xhci"]
        - ["-device", "usb-tablet,bus=xhci.0"]
        - ["-device", "usb-kbd,bus=xhci.0"]

        # THE RECOVERY IMAGE, AS REMOVABLE MEDIA. No `bootindex`: the firmware reaches it only after
        # OpenCore hands over.
        - ["-drive", "file={{recovery}},media=disk,if=none,id=rec,readonly=on"]
        - ["-device", "usb-storage,bus=xhci.0,drive=rec"]

        # THE TARGET.
        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target"]
        - ["-device", "virtio-blk-pci,drive=target,bootindex=1"]

        # THE THREE ICH9 GLOBALS AND THE RTC/SMBIOS LINES, from macos/15/machine.py's own list.
        - ["-global", "ICH9-LPC.disable_s3=1"]
        - ["-global", "ICH9-LPC.disable_s4=1"]
        - ["-global", "ICH9-LPC.acpi-pci-hotplug-with-bridge-support=off"]
        - ["-rtc", "base=utc"]
        - ["-smbios", "type=2"]

        # BARE `vmware-svga`, NOT `vmware-svga,vgamem_mb=256`, AND THE MEASUREMENT IS THE REASON.
        #
        # The Python implementation sets vgamem_mb=256 for an INSTALLED macOS, which has VMwareGfx
        # loaded and can use the memory. THE RECOVERY SYSTEM HAS NO SUCH DRIVER, and asking for 256 MB
        # made its framebuffer far WORSE - two runs on adjacent commits, same walkthrough:
        #
        #	22eeda3   bare vmware-svga         1803 frames captured,   3 lost
        #	5ba0c18   vgamem_mb=256              92 frames captured, 264 lost
        #
        # 264 LOST TICKS IS THREE QUARTERS OF THE RECORDING, and the 92 that survived are BLACK.
        - ["-device", "vmware-svga"]

        # THE SOUND CARD. AppleHDA never enumerates a codec under qemu, so this is USB.
        - ["-audiodev", "none,id=snd0"]
        - ["-device", "usb-audio,bus=xhci.0,audiodev=snd0"]

        # THE SMC KEY. macOS reads it to decide whether the firmware is Apple's.
        - ["-device", "isa-applesmc,osk=ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-pci,netdev=net0,mac=52:54:00:56:4d:01,romfile=,host_mtu=1450"]

    # ---------------------------------------------------------------- disk
    disk:
      # AN INSTALLED macOS. No recovery device, and `discard=unmap` ON - which is what keeps a
      # published disk small: measured on an installed macOS 26 disk, `df -h /` said 12 GiB used and
      # 108 GiB available while the host saw 38.4 GiB allocated, and 26 GiB of those were blocks the
      # guest had already freed and `qemu-img convert -c` cannot remove.
      machine: "q35,accel=kvm,vmport=off"

      args:
        - ["-drive", "if=pflash,format=raw,readonly=on,file={{dir}}/macos.rom"]
        - ["-drive", "if=pflash,format=raw,file={{dir}}/macos.vars"]

        - ["-drive", "file={{dir}}/boot.img,format=raw,if=none,id=oc"]
        - ["-device", "virtio-blk-pci,drive=oc,bootindex=0"]

        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "isa-serial,chardev=qga0"]

        - ["-device", "qemu-xhci,id=xhci"]
        - ["-device", "usb-tablet,bus=xhci.0"]
        - ["-device", "usb-kbd,bus=xhci.0"]

        # THE TARGET, AND `discard=unmap` BECAUSE NOTHING IS INSTALLING.
        - ["-drive", "file={{disk}},if=none,format=qcow2,discard=unmap,id=target"]
        - ["-device", "virtio-blk-pci,drive=target,bootindex=1"]

        - ["-global", "ICH9-LPC.disable_s3=1"]
        - ["-global", "ICH9-LPC.disable_s4=1"]
        - ["-global", "ICH9-LPC.acpi-pci-hotplug-with-bridge-support=off"]
        - ["-rtc", "base=utc"]
        - ["-smbios", "type=2"]

        - ["-device", "vmware-svga"]

        - ["-audiodev", "none,id=snd0"]
        - ["-device", "usb-audio,bus=xhci.0,audiodev=snd0"]

        - ["-device", "isa-applesmc,osk=ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-pci,netdev=net0,mac=52:54:00:56:4d:01,romfile=,host_mtu=1450"]
